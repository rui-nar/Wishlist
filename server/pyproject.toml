[project]
name = "wishlist-server"
# Placeholder: the release version lives in the git tag (APP_VERSION), not here.
version = "0.0.0"
description = "Wishlist server (FastAPI)"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    # Apple's own: verifies the App Store's signed payloads and reads the App
    # Store Server API (Apple IAP plan D3); imported only in
    # app/billing/apple_gateway.py.
    "app-store-server-library>=3.1.2",
    # Hashes passwords (sign-in plan D11); imported only in app/accounts/passwords.py.
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.2",
    # Verifies Google ID tokens; requests is its HTTP transport, which fetches
    # Google's signing certificates.
    "google-auth>=2.62.1",
    # Fetches the image URLs owners give, pinned to a vetted address (gift
    # images plan D6); also the test client.
    "httpx>=0.28.1",
    # Decodes uploaded images and re-encodes them as WebP (gift images plan D4).
    "pillow>=13.0.0",
    # Majors capped: psycopg 3 and SQLAlchemy 2 are the stack (plan D1); a new
    # major is a decision, not a Dependabot bump.
    "psycopg[binary]>=3.3.8,<4",
    "pydantic-settings>=2.16.2",
    # Verifies Apple's identity tokens (sign-in plan D14); imported only in
    # app/accounts/apple.py.
    "pyjwt[crypto]>=2.15.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.8,<3",
    # Checkout, the Customer Portal and the webhook (premium plan D10); imported
    # only in app/billing/stripe_gateway.py. Major capped: its API follows Stripe's.
    "stripe>=16.0.0,<17",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
# An application run from server/, not an installable package.
package = false
# A floor, not a pin: an exact pin would block Dependabot and local uv.
required-version = ">=0.13"
# Prefer the installed, signed CPython over a uv-managed one (Smart App Control
# blocks unsigned interpreters on the dev machine); uv still downloads one where
# no system 3.14 exists (CI).
python-preference = "system"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The app is not installed (package = false): tests import it from server/.
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# pyflakes and pycodestyle (the defaults), plus import order, pyupgrade and
# bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The migrations directory server/alembic/ would otherwise make ruff sort the
# alembic library as first-party.
known-third-party = ["alembic"]
