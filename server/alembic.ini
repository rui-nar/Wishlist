[alembic]
script_location = %(here)s/alembic
# Makes `app` importable from env.py when alembic runs from server/.
prepend_sys_path = .
path_separator = os
# No sqlalchemy.url: env.py always takes DATABASE_URL from the app's settings,
# so migrations can only target the database the app itself would use.

[post_write_hooks]
# New revisions come out formatted the way `ruff check` expects.
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
