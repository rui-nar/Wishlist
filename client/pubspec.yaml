name: wishlist
description: "Wishlist Flutter client: web, Android, iOS."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # English and French (DESIGN_SYSTEM_PLAN D8). intl follows the constraint
  # flutter_localizations sets.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0
  http: ^1.6.0

  # Routing with the sign-in guard, and the auth state (ACCOUNTS_PLAN D10).
  go_router: ^18.1.3
  provider: ^6.1.5+1
  # The path URL strategy on the web: /account, not /#/account.
  flutter_web_plugins:
    sdk: flutter

  # Google sign-in (D11): the web part is the vendored google_sign_in_web,
  # through dependency_overrides below.
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3

  # The session token: the platform's secure storage on Android and iOS, the
  # browser's local storage on the web (D10).
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # Gift links open in the external browser (LISTS_GIFTS_SHARING_PLAN D12).
  url_launcher: ^6.3.3

  # Occasion links go out through the platform's share sheet
  # (LISTS_GIFTS_SHARING_PLAN U4).
  share_plus: ^13.3.1

  # A gift's image (GIFT_IMAGES D14): picked from the device, re-encoded and
  # resized by the picker before upload (D5), or read from the clipboard.
  image_picker: ^1.2.4
  pasteboard: ^0.6.0
  # The browser's paste event in the gift form (D14), web only.
  web: ^1.1.2

  # Apple sign-in (sign-in plan D16); crypto hashes the nonce given to Apple.
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8

  # Premium bought on iPhone (Apple IAP plan D3), with StoreKit 2, and on
  # Android through Google Play Billing (Android release plan D6): each
  # platform's implementation behind the app's own store interface, not the
  # in_app_purchase facade.
  in_app_purchase_storekit: ^0.4.17
  in_app_purchase_platform_interface: ^1.4.1
  in_app_purchase_android: ^0.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Referenced directly by the tests, which stand in for Google's platform
  # implementation to see when and how sign-in is initialised.
  google_sign_in_platform_interface: ^3.1.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Referenced by the tests, which stand in for url_launcher's platform
  # implementation to see which links a screen opens.
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8
  # Referenced by the tests, which stand in for the share sheet.
  share_plus_platform_interface: ^7.2.0
  # Referenced by the tests, which stand in for the image picker.
  image_picker_platform_interface: ^2.11.2
  # Referenced by the tests, which stand in for Apple's sign-in.
  sign_in_with_apple_platform_interface: ^2.0.0

# google_sign_in_web 1.1.3 with Google's script loaded in init() instead of at
# plugin registration, so only the sign-in screen fetches it (ACCOUNTS_PLAN
# D11, flutter/flutter#194640). See third_party/google_sign_in_web/README.md.
dependency_overrides:
  google_sign_in_web:
    path: third_party/google_sign_in_web

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Generates AppLocalizations from lib/l10n/*.arb on pub get (l10n.yaml).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # The fonts' licence texts, registered with LicenseRegistry in main.dart.
  assets:
    - assets/fonts/inter/OFL.txt
    - assets/fonts/space_grotesk/OFL.txt

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  # Bundled, never fetched (DESIGN_SYSTEM_PLAN D4); sources and sha256 in
  # assets/fonts/README.md.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/space_grotesk/SpaceGrotesk-Bold.ttf
          weight: 700
    # The web engine downloads Roboto from fonts.gstatic.com unless a family
    # of that name is in the font manifest: alias it to Inter.
    - family: Roboto
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
