name: Tests

on:
  push:
    branches: [master]
  # Any base branch: a pull request into a feature branch is tested too.
  pull_request:
  # Runs any branch by hand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    # The tests run against real PostgreSQL, never SQLite (plan D12). The image
    # is the one pinned in docker-compose.dev.yml and the deploy compose files;
    # Dependabot does not update it here, so move it with them by hand.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: shushgift
          POSTGRES_PASSWORD: shushgift
          POSTGRES_DB: shushgift_test
        ports:
          - 5432:5432
        # -h localhost: without it pg_isready reports healthy while the image's
        # first-boot init server listens on the unix socket only (review R1-4).
        options: >-
          --health-cmd "pg_isready -h localhost -U shushgift -d shushgift_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      # The variable the app, Alembic and the tests read. 127.0.0.1, not
      # localhost, as in .env.example. The image's user is a superuser, so it
      # has CREATEDB, which the migration test needs.
      DATABASE_URL: postgresql+psycopg://shushgift:shushgift@127.0.0.1:5432/shushgift_test
      # The environment is synced once, explicitly, with --locked. Without this
      # every `uv run` would first re-sync it.
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v7

      # The uv version is the Dockerfile's uv stage tag, exactly: move both
      # together. uv installs the Python of .python-version.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check migrations are in sync with models
        # Applies every migration, then asks Alembic whether autogenerate would
        # produce any further changes: fails when the models and the migration
        # head have drifted apart.
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Lint
        run: uv run ruff check

      - name: Run tests
        run: uv run pytest -v --tb=short

  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7

      # The SDK version is the Dockerfile's FLUTTER_TAG, goldens.ps1's, the
      # dev machine's, the android job's below, ios-release.yml's and
      # android-release.yml's: move them all together.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # The vendored google_sign_in_web's patch: no Google script before
      # init(). Only a browser can see the page's script tags; the runner's
      # Chrome runs it.
      - name: Test vendored google_sign_in_web
        working-directory: client/third_party/google_sign_in_web
        run: |
          flutter pub get
          flutter test --platform chrome

      # A failed golden comparison writes its diff images to a failures/
      # directory next to the test (plan D10). Uses steps ignore the job's
      # working-directory, so the path starts at the repository root.
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: client/test/**/failures/
          if-no-files-found: ignore

  # No iOS build here: the private repository's Actions minutes count macOS
  # ten times (Shush Gift plan D3a). ios-release.yml builds it, on release
  # tags and by hand.

  # The Android project builds (ANDROID_RELEASE_PLAN D4): the PROD flavour's
  # release bundle with no secrets, so with the placeholder application id and
  # signed with the debug key (D1, D3). android-release.yml builds the same way.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7

      # The dev machine's JDK. The Android Gradle plugin needs 17 or later.
      # The Gradle cache is keyed on the project's Gradle files.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Pinned as in the client job: move them together.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build
        run: flutter build appbundle --flavor prod
