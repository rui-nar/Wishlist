# The VAL webhook matches on this workflow's name: do not rename it.
name: Build and publish Docker image

on:
  push:
    tags:
      - 'v*'
      # 'v*' already glob-matches this literally, but it is listed explicitly
      # so the trigger does not rely on that coincidence. The validation build
      # gets its own tag selection below: it must never touch `:latest`, which
      # real v* releases own.
      - 'validation'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GHCR login with the built-in GITHUB_TOKEN, no personal token to store
      # or renew. The Dockerfile's org.opencontainers.image.source label links
      # the package to the repository.
      packages: write

    env:
      IMAGE: ghcr.io/rui-nar/shushgift
      REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The version the image reports (plan D11). The `validation` tag is
      # floating (re-pushed to a new commit each time), so its name alone does
      # not say which commit a running validation build is on. Real v* tags are
      # one-shot and already identify their commit, so they pass through as-is.
      - name: Determine app version
        id: app_version
        run: |
          if [ "$REF_NAME" = "validation" ]; then
            version="validation-$(git rev-parse --short HEAD)"
          else
            version="$REF_NAME"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `validation` only ever produces :validation, never :latest or a :<sha>
      # tag, both of which belong to real v* releases (plan D6). Re-cut it with
      # git tag -f validation <commit> && git push origin validation --force.
      - name: Select image tags
        id: image_tags
        run: |
          if [ "$REF_NAME" = "validation" ]; then
            tags="$IMAGE:validation"
          else
            tags=$(printf '%s:latest\n%s:%s\n%s:%s' "$IMAGE" "$IMAGE" "$GITHUB_SHA" "$IMAGE" "$REF_NAME")
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The Dockerfile builds the Flutter web client itself, at its pinned SDK.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.version }}
          tags: ${{ steps.image_tags.outputs.tags }}
