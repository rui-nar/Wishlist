version: 2

# Keeps the lock files, the images and the actions current. Merging stays
# manual. Security advisories open their own PRs regardless of this schedule.
updates:
  # server/pyproject.toml and server/uv.lock: minor and patch updates in one
  # PR, each major on its own.
  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # client/pubspec.yaml and client/pubspec.lock, grouped the same way.
  - package-ecosystem: pub
    directory: /client
    schedule:
      interval: weekly
    groups:
      dart-minor-and-patch:
        update-types: [minor, patch]

  # The Dockerfile's base images. Moving its uv stage tag means moving the
  # setup-uv `version:` in test.yml to the same tag in the same PR.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A CPython minor is a deliberate change of .python-version, the
      # Dockerfile and requires-python together, never a Dependabot PR; the
      # 3.14-slim tag already floats to the latest 3.14 patch at each build.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # The Postgres image, pinned to the same version in every environment.
  # Grouped so one PR moves every compose file together; the service image in
  # test.yml is not covered by Dependabot and moves in that same PR by hand.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/prod
      - /deploy/val
    schedule:
      interval: weekly
    groups:
      postgres:
        patterns: ["postgres"]
    ignore:
      # A Postgres major needs the runbook's dump-and-restore, never a
      # Dependabot PR (plan D16).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
