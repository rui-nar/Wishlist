# Wishlist PROD on the VPS (plan D2, D3, D8, D9, D14, D18).
#
# Installed as /opt/wishlist/docker-compose.yml, next to its .env (copied from
# .env.example and filled in, never committed) and backup/ (the two scripts of
# deploy/backup/). docs/DEPLOYMENT.md creates the directories it mounts:
#
#   /opt/wishlist/backups        999:10001, mode 750  (the backup service's dumps;
#                                the app lists them, cannot read them)
#   /opt/wishlist-media/prod     10001:10001        (the app's uploaded files)
#
# `docker compose restart` does not pick up .env changes: the container has to
# be recreated with `docker compose up -d`.

# A fixed project name: the volume is `wishlist-prod_pgdata` whatever the
# directory is called, and never collides with TraxJourney's projects.
name: wishlist-prod

# Docker's default json-file driver keeps every log line forever. The 40 GB
# disk is shared with TraxJourney, so each container keeps at most 3 × 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    # Only `v*` releases are tagged `latest` (plan D6).
    image: ghcr.io/rui-nar/wishlist:latest
    restart: unless-stopped
    # DATABASE_URL, APP_ENV, FRONTEND_ORIGIN and FORWARDED_ALLOW_IPS (plan D10).
    env_file: .env
    environment:
      # The media purge dates the oldest kept dump (gift images plan D9, D10).
      # Set here, not in .env: `environment:` wins over `env_file:`, so no
      # .env can point the purge elsewhere. Unset (VAL, DEV), nothing is purged.
      BACKUP_DIR: /app/backups
    ports:
      # Loopback only: Docker's published ports bypass ufw, so a bare
      # `8010:8000` would be on the internet. Caddy reaches it on the host.
      - "127.0.0.1:8010:8000"
    volumes:
      # The image sets MEDIA_DIR=/app/media and no .env overrides it (D18), so
      # uploads always land here and survive the container.
      - /opt/wishlist-media/prod:/app/media
      # Read-only, and the directory is 999:10001 mode 750 with each dump 600:
      # the app (uid and gid 10001) lists the dumps and reads their dates, never
      # their content (gift images plan D10).
      - /opt/wishlist/backups:/app/backups:ro
    depends_on:
      # The entrypoint runs `alembic upgrade head` first, which needs the
      # database accepting TCP connections.
      db:
        condition: service_healthy
    healthcheck:
      # /api/health checks the database and that /app/media is writable; the
      # image has Python but no curl. urlopen raises on the 503, so a failing
      # part makes the container unhealthy in `docker ps`.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Migrations run before uvicorn listens.
      start_period: 2m
      start_interval: 2s
    deploy:
      resources:
        limits:
          memory: 320M
    logging: *logging

  db:
    # Pinned to one exact version, the same in DEV, CI, VAL and PROD (plan D2).
    # Major versions move only by hand (D16).
    image: postgres:18.6
    restart: unless-stopped
    # POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB, read on first boot only.
    env_file: .env
    # Sized for the 256 MB limit: 64 MB of shared buffers, and 25 connections
    # (the app's pool is 5 + 10 overflow, plus the backup and an operator's
    # psql) at a few MB each.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=25"]
    # No `ports:` (plan D3): only the app and the backup reach it, over the
    # project's network.
    volumes:
      # Postgres 18's image keeps its data in /var/lib/postgresql/18/docker and
      # refuses a mount at the old /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h localhost: without it pg_isready reports healthy while the image's
      # first-boot init server listens on the unix socket only (review R1-4).
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 1m
      start_interval: 2s
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

  # Nightly pg_dump (plan D9): once on start, then every day at 02:00 UTC, into
  # /opt/wishlist/backups, the 30 newest kept. A sidecar on the same pinned
  # image, because the dump needs Postgres's own client tools.
  backup:
    image: postgres:18.6
    restart: unless-stopped
    # The `postgres` user of the official image owns the backups directory
    # (D14), so nothing here runs as root.
    user: "999:999"
    entrypoint: ["sh", "/backup/backup.sh"]
    # The POSTGRES_* credentials the dump connects with.
    env_file: .env
    volumes:
      - ./backup:/backup:ro
      - /opt/wishlist/backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Unhealthy when no dump is newer than 26 hours (review R1-1): a failing
      # backup shows in `docker ps` without reading logs.
      test: ["CMD", "sh", "/backup/healthcheck.sh"]
      interval: 10m
      timeout: 10s
      retries: 1
      # The first dump runs on start; until it lands, failures do not count.
      start_period: 10m
      start_interval: 5s
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *logging

volumes:
  pgdata:
